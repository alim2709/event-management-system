# Event type with creator relationship
type Event @node {
  id: ID! @id                 # Unique ID for the event
  title: String!              # Title of the event
  description: String         # Optional description
  date: String!               # Date of the event
  location: String!           # Location of the event
  meetupType: MeetupType!     # Enum: ONLINE or OFFLINE
  createdBy: User! @relationship(type: "CREATED", direction: IN)
}

# Enum for specifying meetup type
enum MeetupType {
  ONLINE                      # Online event
  OFFLINE                     # Offline event
}

input EventCreateInput {
  title: String!
  meetupType: MeetupType!
  location: String!
  description: String
  date: String!
}

